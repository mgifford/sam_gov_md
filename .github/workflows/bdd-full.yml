name: BDD full checks

on:
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: |
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          python -m playwright install chromium

      - name: Run full BDD checks
        env:
          RUN_PLAYWRIGHT_BDD: "1"
        run: |
          python -m pytest \
            tests/test_bdd_feature_contract.py \
            tests/test_search_bdd_playwright.py
