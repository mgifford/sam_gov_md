name: BDD fast checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright requests
          python -m playwright install chromium

      - name: Run fast BDD checks
        env:
          RUN_PLAYWRIGHT_BDD: "1"
        run: |
          python -m pytest \
            tests/test_bdd_feature_contract.py \
            tests/test_search_bdd_playwright.py \
            -m "not slow"
