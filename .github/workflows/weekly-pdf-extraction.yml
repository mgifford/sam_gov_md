name: Weekly PDF extraction

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 1'  # Monday 11:15 AM UTC

permissions:
  contents: write

concurrency:
  group: sam-gov-weekly-pdf
  cancel-in-progress: false

jobs:
  extract_pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Sync dependencies
        run: |
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Download latest CSV
        run: |
          python scripts/download_csv.py

      - name: Process latest opportunities and wins
        run: |
          TARGET_DATE=$(TZ=America/New_York date +%F)
          echo "TARGET_DATE=$TARGET_DATE"
          python scripts/process_today.py \
            --target-date "$TARGET_DATE" \
            --fallback-latest \
            --source-url data/ContractOpportunitiesFullCSV.csv

      - name: Persist and deduplicate snapshot
        run: |
          python scripts/persist_to_sqlite.py

      - name: Build high-value alerts
        run: |
          python scripts/generate_alerts.py --min-hits 8

      - name: Export department trends
        run: |
          python scripts/export_trends.py

      - name: Export all opportunities for search
        run: |
          python scripts/export_all_opportunities.py

      - name: Extract PDFs from opportunities
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          # Extract PDFs for top 50 opportunities (~10-15 with valid PDFs)
          # --save-pdf stores the raw PDF alongside the extracted markdown
          # --api-key uses SAM_API_KEY env var (falls back to DEMO_KEY if unset)
          python scripts/scrape_opportunities.py \
            --limit 50 \
            --csv data/ContractOpportunitiesFullCSV.csv \
            --save-pdf \
            --api-key "${SAM_API_KEY:-DEMO_KEY}"

      - name: Re-export opportunities with PDF content indicators
        run: |
          # Re-run export so that has_pdf_content and pdf_text fields reflect
          # the pdf_content.md files that were just created above.
          python scripts/export_all_opportunities.py

      - name: Generate recompete dashboard data
        run: |
          python scripts/build_recompete_risk.py \
            --cohort ai \
            --fy-start 2026-10-01 \
            --fy-end 2027-09-30 \
            --output-json data/today/recompetes_ai.json \
            --output-docs-json docs/data/recompetes.json \
            --output-paracharts-spec docs/data/recompetes_paracharts_specs.json \
            --output-md data/today/summary_ai.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/today/summary.json \
            data/today/opportunities.json \
            data/today/wins.json \
            data/today/relationships.json \
            data/today/high_value_matches.json \
            data/today/high_value_alert.md \
            data/today/alerts_summary.json \
            data/today/recompetes_ai.json \
            data/today/summary_ai.md \
            docs/data/today_summary.json \
            docs/data/today_relationships.json \
            docs/data/today_departments.json \
            docs/data/trends.json \
            docs/data/time_to_award.json \
            docs/data/recompetes.json \
            docs/data/recompetes_paracharts_specs.json \
            docs/opportunities

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          git commit -m "chore: weekly PDF extraction refresh ($(date -u +%F))"
          git push
